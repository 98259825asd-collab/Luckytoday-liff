<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lucky Today</title>
</head>

<body style="font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding:16px;">

  <h1 style="margin:0 0 6px;">🍀 Lucky Today</h1>
  <p style="margin:0 0 14px;">กดปุ่มด้านล่างเพื่อดูเลขเด็ดวันนี้</p>

  <button id="fortuneBtn" style="padding:10px 14px; font-size:16px;">ดูเลขเด็ดฟรี</button>
  <span style="display:inline-block; width:10px;"></span>
  <button id="payBtn" style="padding:10px 14px; font-size:16px;">🔒 ดูเลขเด็ดพรีเมียม</button>

  <div id="result" style="margin-top:18px; font-size:18px; line-height:1.45;"></div>

  <!-- 결제/언락 박스 (처음엔 숨김) -->
  <div id="paymentBox" style="display:none; margin-top:18px; padding:14px; border:1px solid #ddd; border-radius:12px;">
    <h3 style="margin:0 0 10px;">💳 ชำระเงินด้วย PromptPay</h3>

    <!-- ✅ QR 이미지 파일명: 너가 업로드한 파일명 그대로 -->
    <img
      src="62087657-74E1-433B-AC23-22BD4326BAAD.png"
      alt="PromptPay QR"
      style="width:260px; max-width:100%; border-radius:10px; border:1px solid #eee;"
    />

    <p style="margin:10px 0 12px;">สแกนเพื่อชำระเงิน แล้วใส่โค้ดเพื่อปลดล็อก</p>

    <!-- 간단 언락 코드 입력 (백엔드 없는 버전) -->
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <input
        id="unlockCode"
        placeholder="ใส่โค้ด"
        style="padding:10px 12px; font-size:16px; width:160px;"
      />
      <button id="unlockBtn" style="padding:10px 14px; font-size:16px;">ปลดล็อก</button>
      <button id="closePay" style="padding:10px 14px; font-size:16px;">ปิด</button>
    </div>

    <small style="display:block; margin-top:10px; color:#666;">
      * โค้ดทดสอบ: <b>9999</b>
    </small>
  </div>

  <script src="app_th.js"></script>
</body>
</html>
