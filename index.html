<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lucky Today</title>
</head>
<body style="font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding:16px;">

  <h1 style="margin:0 0 6px;">🍀 Lucky Today</h1>
  <p style="margin:0 0 14px;">กดปุ่มด้านล่างเพื่อดูดวงวันนี้</p>

  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <button id="fortuneBtn" style="padding:10px 14px; font-size:16px;">ดูดวงฟรี</button>
    <button id="payBtn" style="padding:10px 14px; font-size:16px;">🔒 ดูดวงแบบพรีเมียม</button>
  </div>

  <div id="result" style="margin-top:18px; font-size:18px; line-height:1.45;"></div>

  <hr style="margin:18px 0;">

  <h3 style="margin:0 0 10px;">💳 ชำระเงินด้วย PromptPay</h3>
  <!-- 파일명은 레포에 업로드한 이미지 파일명과 100% 동일해야 함 -->
  <img
    src="62087657-74E1-433B-AC23-22BD4326BAAD.png"
    alt="PromptPay QR"
    style="width:260px; max-width:100%; border-radius:10px; border:1px solid #eee;"
  />
  <p style="margin:10px 0 12px;">สแกนเพื่อชำระเงิน แล้วส่งสลิป</p>

  <a href="https://forms.gle/KDjfT2bVan3DPNvLA" target="_blank" style="text-decoration:none;">
    <button style="padding:10px 14px; font-size:16px;">📩 ส่งหลักฐานการโอน</button>
  </a>

  <hr style="margin:18px 0;">

  <h3 style="margin:0 0 10px;">✅ ใส่รหัสเพื่อปลดล็อกพรีเมียม</h3>
  <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
    <input
      id="codeInput"
      placeholder="ใส่รหัส (เช่น 1234)"
      style="padding:10px 12px; font-size:16px; width:200px;"
    />
    <button id="verifyBtn" style="padding:10px 14px; font-size:16px;">ยืนยันรหัส</button>
  </div>

  <p style="font-size:13px;color:#666;margin-top:10px;">
    หลังส่งสลิปแล้ว รอแอดมินส่งรหัสพรีเมียมให้
  </p>

  <script src="app_th.js"></script>
</body>
</html>
