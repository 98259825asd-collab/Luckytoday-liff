<html lang="th">
<head>
  <meta charset="UTF-8" />

</head>
<body>

  <h1>🍀 Lucky Today</h1>
  <p>กดปุ่มด้านล่างเพื่อดูดวงวันนี้</p>

  <button id="fortuneBtn">ดูดวงฟรี</button>
  <br><br>
  <button id="payBtn">🔒 ดูดวงแบบพรีเมียม</button>

  <div id="result" style="margin-top:20px;font-size:18px;"></div>

  <hr>

  <h3>💳 ชำระเงินด้วย PromptPay</h3>
  <img src="62087657-74E1-433B-AC23-22BD4326BAAD.png" width="220" />

  <a href="https://forms.gle/KDjfT2bVan3DPNvLA" target="_blank">
    <button>📩 ส่งหลักฐานการโอน</button>
  </a>

  <hr>

  <h3>✅ ใส่รหัสเพื่อปลดล็อกพรีเมียม</h3>
  <input id="codeInput" placeholder="ใส่รหัส (เช่น 1234)" style="padding:8px;width:220px;" />
  <button id="verifyBtn">ยืนยันรหัส</button>

  <p style="font-size:13px;color:#555;margin-top:8px;">
    หลังส่งสลิปแล้ว รอแอดมินส่งรหัสให้
  </p>

  <script src="app_th.js"></script>
<p style="font-size:12px;color:#999;">
  Admin today code: <span id="adminCode"></span>
</p>
<script>
  // app_th.js의 DAILY_CODE를 화면에 보여주기 위해 같은 로직으로 다시 계산
  (function(){
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    const ymd = `${y}${m}${d}`;
    let hash = 0;
    for (let i = 0; i < ymd.length; i++) hash = (hash * 31 + ymd.charCodeAt(i)) % 10000;
    const code = String(hash).padStart(4, "0");
    document.getElementById("adminCode").textContent = code;
  })();
</script>
</body>
</html>
